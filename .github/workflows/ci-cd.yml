name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (OCR Engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ocr-service/requirements.txt

      - name: Install Python OCR Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ocr-service/requirements.txt

      - name: Run Python OCR Unit Tests
        run: python services/ocr-service/test_letter_parser.py

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Start Services for Unit Tests
        run: |
          sudo systemctl start redis-server || true
          sudo systemctl start mysql || true
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS db_suratizin; CREATE USER IF NOT EXISTS 'surat_user'@'localhost' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON db_suratizin.* TO 'surat_user'@'localhost'; FLUSH PRIVILEGES;" 2>/dev/null || true

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/test
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_2026
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  deploy:
    name: Deploy to Server
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/project/suratIjin
            ./scripts/deploy.sh prod
