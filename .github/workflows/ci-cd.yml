name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (OCR Engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ocr-service/requirements.txt

      - name: Install Python OCR Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ocr-service/requirements.txt

      - name: Run Python OCR Unit Tests
        run: python services/ocr-service/test_letter_parser.py

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Start Services for Unit Tests
        run: |
          sudo service redis-server start 2>/dev/null || redis-server --daemonize yes 2>/dev/null || true
          sudo service mysql start 2>/dev/null || sudo systemctl start mysql 2>/dev/null || true
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS db_suratizin; CREATE DATABASE IF NOT EXISTS db_suratizin_test; CREATE USER IF NOT EXISTS 'surat_user'@'localhost' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'localhost' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'localhost'; CREATE USER IF NOT EXISTS 'surat_user'@'127.0.0.1' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'127.0.0.1' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'127.0.0.1'; CREATE USER IF NOT EXISTS 'surat_user'@'%' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'%' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || sudo mysql -e "CREATE DATABASE IF NOT EXISTS db_suratizin; CREATE DATABASE IF NOT EXISTS db_suratizin_test; CREATE USER IF NOT EXISTS 'surat_user'@'localhost' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'localhost' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'localhost'; CREATE USER IF NOT EXISTS 'surat_user'@'127.0.0.1' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'127.0.0.1' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'127.0.0.1'; CREATE USER IF NOT EXISTS 'surat_user'@'%' IDENTIFIED BY 'surat_pass_2026'; ALTER USER 'surat_user'@'%' IDENTIFIED BY 'surat_pass_2026'; GRANT ALL PRIVILEGES ON *.* TO 'surat_user'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || true
          DATABASE_URL="mysql://surat_user:surat_pass_2026@127.0.0.1:3306/db_suratizin_test" npx tsx scripts/init-db.ts
          DATABASE_URL="mysql://surat_user:surat_pass_2026@127.0.0.1:3306/db_suratizin_test" npm run db:seed
        env:
          DATABASE_URL: mysql://surat_user:surat_pass_2026@127.0.0.1:3306/db_suratizin_test
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_2026

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit
        env:
          DATABASE_URL: mysql://surat_user:surat_pass_2026@127.0.0.1:3306/db_suratizin_test
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_2026
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/test
          JWT_SECRET: ci_secret_key_for_testing_purposes_only_2026
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  deploy:
    name: Deploy to Server
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && secrets.SERVER_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/project/suratIjin
            ./scripts/deploy.sh prod
